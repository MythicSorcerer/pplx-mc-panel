x-mc Defaults: &mc
  image: mc-server:latest
  restart: unless-stopped
  init: true
  volumes:
    - mc-data:/data
  env_file:
    - .env.mcserver
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8080/info"]
    interval: 30s
    timeout: 10s
    retries: 3
    startPeriod: 30s

services:
  mcserver:
    <<: *mc
    build:
      context: .
      dockerfile: Dockerfile.mcserver
    ports:
      - "25565:25565"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
        reservations:
          cpus: "1"
          memory: 1G

volumes:
  mc-data: